<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="《伊莫》捕捉、Twine 融合与开放世界探索玩法介绍。"><link rel="canonical" href="https://aniimogg.com/guides/core-gameplay.html"><title>核心玩法速览｜Aniimo GG</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../site-content.css"></head><body class="article-page"><header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">A</span><span>Aniimo<span class="brand-dot">.GG</span></span></a></header><main class="article-shell"><a href="../index.html">← 返回首頁</a><article><p class="label">玩法整理</p><h1>捕捉、融合与探索</h1><p class="lead">《伊莫》的关键不只是收集生物，而是让伊莫能力直接改变移动、探索与战斗方式。</p><h2>捕捉与培养</h2><p>在开放世界遇见并捕捉不同伊莫，再培养牠们参与战斗与探索。正式版捕捉公式、稀有度与成本仍需开服实测。</p><h2>Twine 融合</h2><p>玩家可与伊莫融合，以新的视角和能力行动，不同伊莫可能对应不同环境交互与移动解法。</p><h2>立体开放世界</h2><p>官方公开了滑翔、潜水和钻地等探索方式，也强调单人与好友共同探索。</p><aside>本页只整理官方已公开的玩法方向，不把测试服数值写成正式结论。</aside></article></main></body></html>
